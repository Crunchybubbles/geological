modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="CrunchyBubbles"
description='''
Geological generates deterministic, causal geology for Minecraft dimensions.
The Overworld generator/preset hook now applies the bounded geological terrain plan, explicit
surface water/air, and a bounded regolith/surface-clue projection; read-only `/geology` traces are
available, while dimension-native Nether/End generation follows in subsequent verified increments.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
