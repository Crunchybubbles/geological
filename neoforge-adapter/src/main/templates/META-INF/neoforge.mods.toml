modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="CrunchyBubbles"
description='''
Geological generates deterministic, causal geology for Minecraft dimensions.
The Overworld, Nether, and End generator/preset hooks now apply their bounded native geological
terrain plans, explicit surface/void/fluid states, and a bounded regolith/surface-clue projection;
read-only `/geology` traces for
columns, maps, sections, vertical cross-sections, transient surface observations, coarse hand-sample, soil/stream/heavy-mineral, geochemical anomaly, drill-core readouts, and bounded per-player discovery notebooks/maps are available; serial/shuffled
generation and seam observations are available through the standalone benchmark task, while
dimension-native Nether/End generation is provided by their profile-locked compilers; the standalone
exploration telemetry task records bounded clue-sufficiency and travel-burden observations, and
the read-only `/geology secondary`, `/geology laterite`, `/geology placers`, `/geology
paleosurface`, and `/geology glacial` views expose source-budgeted or structural Phase 6
secondary overlays; glacial behavior remains opt-in behind explicit ice-history evidence. The
`/geology greisen` view exposes the Phase 7 evolved-felsic residual-fluid proxy overlay, which is
not an Sn/W assay or voxel-grade inventory. The `/geology skarn` view is actual-host-only by
default and exposes the Phase 7 carbonate-contact proof without inventing a host body. The
`/geology epithermal` view exposes the Phase 7 shallow magmatic-hydrothermal fluid-path proxy;
its silica/argillic horizons are not Au/Ag assays or voxel-grade inventories. The
`/geology orogenic-gold` view exposes the Phase 7 deformation/metamorphic-fluid proxy;
its quartz-carbonate/sulfide horizons are not Au assays or voxel-grade inventories. The
`/geology basin-hydrothermal` view exposes separate MVT Pb-Zn, SEDEX Zn-Pb-Ag, and
sediment-hosted copper basin/redox proxies; the default planner resolves actual hosts only and
the deterministic dolostone fixture is review-only. Its horizons are not metal assays or
voxel-grade inventories. The `/geology uranium` view exposes source-gated unconformity-related
and sandstone roll-front uranium redox/groundwater proxies; its old-basement, aquifer, and
reducing-trap evidence is not a uranium assay, reserve, grade, or voxel-grade inventory.
The `/geology layered-intrusion` view exposes source-gated stratiform chromite, basal Ni-Cu-PGE
sulfide, and layered PGE-reef proxies; the default planner resolves actual hosts only and the
deterministic layered-chamber fixture is review-only. Its horizons are not metal assays, grades,
reserves, or voxel-grade inventories.
The `/geology carbonatite-kimberlite` view exposes source-gated carbonatite and peralkaline REE/Nb/P
and kimberlite diamond-carrier proxies; mantle cargo is kept separate from the carrier pipe, and
the deterministic alkaline-complex fixture is review-only. Its horizons are not assays, grades,
reserves, or voxel-grade inventories.
The `/geology sedimentary-resources` view exposes source-gated phosphorite, sedimentary manganese,
coal, lithium/potash/borate brine, and helium-bearing gas proxies; fluids remain porous-medium
state and the deterministic facies fixture is review-only. Its horizons are not assays, grades,
reserves, or voxel-grade inventories.
The `/geology geothermal` view exposes source-gated high-enthalpy, fault-controlled, sedimentary
aquifer, and hot-dry-rock heat/reservoir proxies; heat and fluids remain porous-medium state and
the deterministic reservoir fixture is review-only. Its horizons are not temperatures, flow rates,
reserves, or voxel-grade inventories.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

