modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="CrunchyBubbles"
description='''
Geological generates deterministic, causal geology for Minecraft dimensions.
The Overworld generator/preset hook now applies the bounded geological terrain plan, explicit
surface water/air, and a bounded regolith/surface-clue projection; read-only `/geology` traces for
columns, maps, sections, vertical cross-sections, transient surface observations, coarse hand-sample, soil/stream/heavy-mineral, geochemical anomaly, drill-core readouts, and bounded per-player discovery notebooks/maps are available; serial/shuffled
generation and seam observations are available through the standalone benchmark task, while
dimension-native Nether/End generation follows in subsequent verified increments; the standalone
exploration telemetry task records bounded clue-sufficiency and travel-burden observations, and
the read-only `/geology secondary` view exposes the source-budgeted Phase 6 supergene overlay.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
